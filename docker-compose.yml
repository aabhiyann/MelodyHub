version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/melodyhub
      - NODE_ENV=production
    depends_on:
      - mongo
    networks:
      - melody-network

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - melody-network

networks:
  melody-network:
    driver: bridge

volumes:
  mongo-data:
